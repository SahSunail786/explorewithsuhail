<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="icon" href="assets/favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,600|Open+Sans:300,400,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/bootstrap.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            font-family: 'Open Sans', sans-serif;
            background-color: #f5f5f5;
        }

        .hero {
            height: 100vh;
            background-image: url('assets/hero-bg.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            color: #fff;
            text-align: center;
            z-index: 2;
        }

        .hero-content h1 {
            font-size: 48px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 15px;
        }

        .hero-content h3 {
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 25px;
            color: #fff;
        }

        .hero-content .btn-primary {
            background-color: #6c63ff;
            padding: 12px 30px;
            color: white;
            font-weight: 600;
            border: none;
            border-radius: 25px;
            text-decoration: none;
        }

        .hero-content .btn-primary:hover {
            background-color: #574fd2;
        }

        .main-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 20px;
            z-index: 3;
        }

        .main-nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .main-nav ul li {
            display: inline-block;
        }

        .main-nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            font-size: 18px;
            padding: 5px 15px;
        }

        .main-nav ul li a:hover {
            color: #6c63ff;
            border-bottom: 2px solid #6c63ff;
        }

        .social-links {
            margin-top: 30px;
            text-align: center;
        }

        .social-links h3 {
            margin-bottom: 15px;
            font-size: 18px;
        }

        .social-links a {
            display: inline-block;
            margin: 0 10px;
        }

        .social-links img {
            width: 30px;
            transition: transform 0.3s ease;
        }

        .social-links img:hover {
            transform: scale(1.1);
        }

        @media (max-width: 768px) {
            .hero-content h1 {
                font-size: 32px;
            }

            .hero-content h3 {
                font-size: 18px;
            }

            .main-nav ul {
                flex-direction: column;
            }
            
            .social-links {
                margin-top: 20px;
            }
            
            .social-links a {
                margin: 0 5px;
            }
        }
    </style>
</head>

<body>

</div>
